# ================================================================
# SonarQube Scanner Configuration — HomeIQ Flutter App
# ================================================================
#
# WHAT IS THIS FILE?
#   This file tells SonarScanner (the CLI tool that analyzes code)
#   everything it needs to know:
#     - Which server to send results to (sonar.host.url)
#     - Which files to analyze (sonar.sources, sonar.tests)
#     - Where the test coverage report is (sonar.flutter.coverage.reportPath)
#     - What to skip (sonar.exclusions)
#
# HOW IT WORKS:
#   1. You run: flutter test --coverage   → generates coverage/lcov.info
#   2. You run: sonar-scanner            → reads this file, sends report to SonarQube
#   3. SonarQube server displays results at http://localhost:9000
#
# SONAR-FLUTTER PLUGIN:
#   SonarQube does not support Dart/Flutter out of the box.
#   We use the open-source community plugin:
#   https://github.com/insideapp-oss/sonar-flutter
#   Install it first: powershell scripts/setup-sonarqube.ps1
#
# ================================================================


# ----------------------------------------------------------------
# PROJECT IDENTITY
# These values uniquely identify this project in SonarQube.
# The projectKey must be unique across all your SonarQube projects.
# ----------------------------------------------------------------
sonar.projectKey=homeiq-flutter-app
sonar.projectName=HomeIQ Flutter App
sonar.projectVersion=1.0.0


# ----------------------------------------------------------------
# SERVER CONNECTION
# Override with env var: SONAR_HOST_URL=http://your-server:9000
# The token is never stored here — always use the env variable.
# Set it before running: set SONAR_TOKEN=your_generated_token
# ----------------------------------------------------------------
sonar.host.url=http://localhost:9000


# ----------------------------------------------------------------
# SOURCE CODE PATHS
# sonar.sources = production code (what gets analyzed for bugs/smells)
# sonar.tests   = test files (used for coverage calculation)
# Both paths are relative to THIS file's location (packages/app/)
# ----------------------------------------------------------------
sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8


# ----------------------------------------------------------------
# LANGUAGE
# Tells SonarQube to use the Dart/Flutter plugin for analysis.
# Without the sonar-flutter plugin installed, this will fail.
# Plugin is installed: sonar-flutter-plugin-0.5.2.jar
# ----------------------------------------------------------------
sonar.language=dart


# ----------------------------------------------------------------
# CODE COVERAGE
# SonarQube reads the LCOV report generated by Flutter's test runner.
# Generate it with: flutter test --coverage
# This creates: packages/app/coverage/lcov.info
#
# The coverage report tells SonarQube:
#   - Which lines are executed during tests (covered)
#   - Which lines are never tested (uncovered = risk!)
# ----------------------------------------------------------------
sonar.flutter.coverage.reportPath=coverage/lcov.info


# ----------------------------------------------------------------
# TEST EXECUTION REPORT (optional but recommended)
# Generate with: flutter test --machine > test-results/flutter-tests.json
# This shows SonarQube how many tests passed/failed.
# ----------------------------------------------------------------
sonar.flutter.tests.reportPath=test-results/flutter-tests.json


# ----------------------------------------------------------------
# EXCLUSIONS
# Comment out for now to allow all files to be detected
# Files/folders to SKIP during analysis.
# ----------------------------------------------------------------
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.gen.dart,\
  **/generated/**,\
  build/**,\
  **/.dart_tool/**,\
  **/ios/**,\
  **/android/**,\
  **/web/**,\
  **/windows/**,\
  **/linux/**,\
  **/macos/**,\
  **/.pub-cache/**


# ----------------------------------------------------------------
# TEST EXCLUSIONS
# Don't count test files themselves as "production code to cover".
# ----------------------------------------------------------------
sonar.test.inclusions=test/**


# ----------------------------------------------------------------
# QUALITY GATE (uncomment for CI/CD later)
# When enabled, the sonar-scanner command will FAIL if the project
# does not meet quality thresholds (e.g., coverage < 80%).
# Leave commented for now — enable when setting up CI/CD.
# ----------------------------------------------------------------
# sonar.qualitygate.wait=true


# ----------------------------------------------------------------
# ADVANCED: SCM (Source Control) Integration
# Allows SonarQube to show which developer introduced each issue.
# Leave as default (auto-detect) for normal Git usage.
# ----------------------------------------------------------------
# sonar.scm.provider=git
